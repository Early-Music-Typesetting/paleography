      substitutions:
        title: Substitutions
        description: Substitution performed by the rule application.
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - pattern
            - result
          properties:
            pattern:
              title: Pattern (regex template)
              description: >
                Pattern to be matched. It consists of a modified regex:
                  - use `#1` etc to select entity,
                  - use capturing groups,
                  - use Paleo's character classes,
                  - use custom-defined POSIX-style character classes from `character-classes`.
                Note: avoid using advanced regex features like non-capturing
                groups etc. Some implementations (like POSIX) do not support
                them.
              type: string
              format: regex+
            result:
              title: Substitution result
              description: >
                How the substitution result looks. * use `#1` to select entity.
                * use `\1` to select group (captured in pattern).
              type: string
      settings:
        title: Settings
        description: A definition of rule setting consists of a list of substitutions.
        type: object
        patternProperties:
          $always(-[a-z])+:
            title: Substitute always
            description: Target all pattern matches. If they are marked with `change` token,
              do not substitute.
            $ref: "#/$defs/rule-setting"
          indicated(-[a-z])+:
            title: Substitute indicated
            description: Target all pattern matches if they have `change` token present.
            $ref: "#/$defs/rule-setting"
          auto(-[a-z])+:
            title: Substitute automatically
            description: Perform an automatic substitution based on the most common
              convention.
            $ref: "#/$defs/rule-setting"
          never:
            title: Never substitute
            description: Turn substitution off.
        additionalProperties:
          $ref: "#/$defs/rule-setting"
  rule-setting:
    title: Rule Setting
    description: >
      How the rule is executed. Contains a list of substitutions (performed in
      order they appear).
    type: array
    minContains: 0
    items:
      title: Substitution encoding
      description: >
        Evoke substitution defined in `substitutions` using `#1` notation.

        You can further restrict substitution and make it into: * prefix: #1- *
        infix: -#1- * suffix: -#1
      $comment: >
        Using `^` and `$` directly in the regex is discouraged because the
        client system can use a more complex buissness logic for determining
        boundaries.

        For example, (in Lilypond) a word can be sliced by syllables and whether
        a string contains original word boundary or not needs to determined by
        other means.
      examples:
        - "#1"
        - "#1*"
        - "#2-"
        - "#2-*"
        - -#3-
        - -#4
      type: string
      pattern: ^-?#\d+-?\**$
  source-snippet:
    title: Source Snippet
    description: Description of a relevant place in sources.
    type: object
    additionalProperties: false
    required:
      - source
      - link
      - img
      - script
      - paleo
    properties:
      source:
        title: Source
        description: Source identifier.
        type: string
      link:
        title: Link
        description: Link to a source (preferably to the page)
        type: string
        format: URL
      img:
        title: Image URL
        description: URL of an image containing relevant source snippet.
        type: string
        format: URI
      script:
        title: Snippet's script
        description: What kind of script/font is it.
        type: string
        $comment: Add more formalized values.
      paleo:
        title: Example of Paleo encoding
        description: >
          The Paleo representation of the text from snippet. It must containt
          only one rule (concerning this snippet) set to `indicated`.
        type: string
        pattern: "---\\s*rules:\\s*.+: indicated\\s*---\\s*.+"
  rule-deprecation:
    title: Rule Deprecation
    description: A deprecated rule telling software how to migrate or to throw error.
    type: object
    additionalProperties: false
    required:
      - deprecated
      - remarks
      - version
      - target
    properties:
      deprecated:
        title: Deprecarted flag
        description: "`true` if rule definition is deprecated."
      remarks:
        title: Remarks
        description: Additional migration remarks.
      version:
        title: Deprecation Version
        description: Version since the feature became deprecated.
        type: string
        pattern: \d+\.\d+\.\d+
      target:
        title: Migration target
        description: Rule definition telling client which rule to use instead (null if
          migration is not possible).
        type:
          - string
          - "null"
        pattern: ^-?([a-z]+-)*[a-z]+-?$
