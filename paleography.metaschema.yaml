$schema: http://json-schema.org/draft/2020-12/schema#
$id: paleography

type: object
additionalProperties: false
required: [version, regexp-extensions, metacharacters, character-classes, rule-definitions, presets]
properties:

  version:
    title: Version
    description: Version of the Paleography specification.
    type: string

  regexp-extensions:
    title: Regexp extensions
    description: Metasubstitutions for regexp patterns used by this specification.
    patternProperties:
      "[a-z]([a-z])":
        type: object
        properties:
          doc:
            title: Extention's Description
            description: String with a documentation of the extension.
            type: string
          argumentPattern:
            title: Argument Pattern
            type: string
            format: regex
          evaluation:
            title: Extention's Evaluation
            description: How extension is executed (can use other extensions).
          signature:
            title: Signature (within the regex)
            description: How this extension is realised within a Regex pattern.
            type: string
            format: regex
          example:
            title: Example call.
            type: string
        required: [doc, argumentPattern, evaluation, signature, example]
        additionalProperties: false


  metacharacters:
    title: Metacharacters
    description: All the metacharacters used by this specification.
    type: object
    properties:
      change:
        title: Change
        description: Metacharacter indicating substitution/abbreviation.
        $ref: "#/$defs/metacharacter"
        example: ["*"]
      abbreviate-start:
        title: "Abbreviate: start"
        description: Metacharacter starting contraction
        $ref: "#/$defs/metacharacter"
        example: ["<"]
      abbreviate-end:
        title: "Abbreviate: end"
        description: Metacharacter ending contraction
        $ref: "#/$defs/metacharacter"
        example: [">"]
      ommit-start:
        title: "Ommission: start"
        description: Metacharacter starting ommission
        $ref: "#/$defs/metacharacter"
        example: ["["]
      ommit-end:
        title: "Ommission: end"
        description: Metacharacter ending ommission
        $ref: "#/$defs/metacharacter"
        example: ["]"]
      expand:
        title: Expand
        description: This metacharacter tells client to ignore paleographic change/abbreviation/ommission while still allowing to annotate text correctly.
        $ref: "#/$defs/metacharacter"
        example: ["!"]
      macro-start:
        title: "Macro: start"
        description: This character introduces macro.
        $ref: "#/$defs/metacharacter"
        example: ["\\"]
    additionalProperties: false
    required: [change, abbreviate-start, abbreviate-end, ommit-start, ommit-end, expand, macro-start]

  character-classes:
    type: object
    title: Character classes
    description: >
      Characters defined in this object can be used in `substitution`'s regexp patterns
      to match and substitute parts of the input text.
      You can access them using Posix-inspired class syntax: `[:*:]`.
      _Note_: You must always use the Paleography's default signs.
    properties:
      "*": {}
      "<": {}
      ">": {}
      "[": {}
      "]": {}
      "!": {}
      "\\": {}
      vowel: {}

  rule-definitions:
    type: object
    title: Rule definitions
    description: All the rule definitions that can be used in `rules`.
    patternProperties:
      "^([a-z]+-)*[a-z]+$":
        oneOf:
        - $ref: "#/$defs/rule-definition"
        - $ref: "#/$defs/rule-deprecation"

  presets:
    type: object

  rules:

    type: object

    propertyNames:
      $ref: "#/$defs/rulename"


$defs:

  metacharacter:
    title: "Metacharacter"
    description: "A character that triggers a modification of the input text according to the rules."
    type: string
    maxLength: 1

  rulename:
    title: "Rule name"
    description: "Rule unique identifier."
    type: string
    examples: ["rule", "my-rule"]
    pattern: ^([a-z]+-)*[a-z]+$

  rule-definition:
    title: Rule Definition
    description: A rule definition with all the available settings.
    type: object
    additionalProperties: false
    required: [description, remarks, examples, class, characters, substitutions, settings]
    properties:
      description:
        title: Rule description
        description: A short explanatory note about the rule
        type: string
      remarks:
        title: Rule remarks
        description: Additional commentary on rule's background or implementation.
        type: string
      examples:
        title: Examples
        description: >
          Examples of existing documents where the rule might apply
          containt an example Paleo encoding.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/source-snippet"
      class:
        title: Substitution Class
        description: Class of substitution.
        anyOf:
        - const: allograph
          description: A glyph expanding to another (and only 1) glyph.
        - const: abbreviation
          description: A glyph expanding to more than 1 standard letter.
        - const: contraction
          description: A glyph modifier signalising contraction or ommission of letters.
        - const: mixed
          description: A glyph expressing both allograph/abbreviation and contraction.
      characters:
        title: Characters
        descritpion: Characters used in rule's application.
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [base, char, mufi]
          properties:
            base:
              title: Base Latin character (ASCII)
              description: Most basic Latin character. It is referred in `substitutions`' `pattern` with `#1` syntax.
              examples: [a, b, c]
              $comment: >
                MUFI sometimes provides a reference for base characters
                at "Non-PUA / accessibility alternatives" section,
                however not all characters possess it.
              type: string
              minLength: 1
            char:
              title: Character
              description: Character *available* to use provided by MUFI. Usually it's Unicode, but occasionally MUFI points to like PUA.
              examples: [ꟾ]
              type: string
              minLength: 1
            mufi:
              title: MUFI entity name
              description: MUFI entity name
              examples: [Ilong]
              type: [string, "null"]
              minLength: 1
      substitutions:
        title: Substitutions
        description: Substitution performed by the rule application.
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [pattern, result]
          properties:
            pattern:
              title: Pattern
              description: >
                Pattern to be matched. It consists of a modified regex:

                * use `#1` to select character.
                * use capturing group
                * use custom-defined POSIX-style character classes from `character-classes`.
                Note: avoid using advanced regex features like non-capturing groups etc. Some implementations (like POSIX) do not support them.
              type: string
              format: regex+
            result:
              title: Substitution result
              description: >
                How the substitution result looks.
                * use `#1` to select character.
                * use `\1` to select group (captured in pattern).
              type: string
      settings:
        title: Settings
        description: A definition of rule setting consists of a list of substitutions.
        type: object
        properties:
          always:
            title: Substitute always
            description: Target all pattern matches. If they are marked with `change` metacharacter, do not substitute.
            $ref: "#/$defs/rule-setting"
          indicated:
            title: Substitute indicated
            description: Target all pattern matches if they have `change` token present.
            $ref: "#/$defs/rule-setting"
          auto:
            title: Substitute automatically
            description: Perform an automatic substitution based on the most common convention.
            $ref: "#/$defs/rule-setting"
          never:
            title: Never substitute
            description: Turn substitution off.
        required: [always, indicated]
        additionalProperties:
          $ref: "#/$defs/rule-setting"

  rule-setting:
    title: Rule Setting
    description: >
      How the rule is executed.
      Contains a list of substitutions (performed in order they appear).
    type: array
    minContains: 0
    items:
      title: Substitution encoding
      description: >
        Evoke substitution defined in `substitutions` using `#1` notation.

        You can further restrict substitution and make it into:
        * prefix: #1-
        * infix: -#1-
        * suffix: -#1
      $$comment: >
        Using `^` and `$` directly in the regex is discouraged
        because the client system can use a more complex buissness logic for determining boundaries.

        For example, (in Lilypond) a word can be sliced by syllables and whether a string contains original word boundary or not needs to determined by other means.
      examples: ["#1", "#1*", "#2-", "#2-*", "-#3-", "-#4"]
      type: string
      pattern: "^-?#\\d+-?\\**$"

  source-snippet:
    title: Source Snippet
    description: Description of a relevant place in sources.
    type: object
    additionalProperties: false
    required: [source, link, img, script, paleo]
    properties:
      source:
        title: Source
        description: Source identifier.
        type: string
      link:
        title: Link
        description: Link to a source (preferably to the page)
        type: string
        format: URL
      img:
        title: Image URL
        description: URL of an image containing relevant source snippet.
        type: string
        format: URI
      script:
        title: Snippet's script
        description: What kind of script/font is it.
        type: string
        $comment: Add more formalized values.
      paleo:
        title: Example of Paleo encoding
        description: >
          The Paleo representation of the text from snippet.
          It must containt only one rule (concerning this snippet)
          set to `indicated`.
        type: string
        pattern: "---\\s*rules:\\s*.+: indicated\\s*---\\s*.+"

  rule-deprecation:
    title: Rule Deprecation
    description: A deprecated rule telling software to throw error and display a message about rule deprecation and migration.
    type: object
    additionalProperties: false
    required: [deprecated]
    properties:
      deprecated:
        title: Deprecation Message
        description: A message containing information about rule deprecation and suggestion for migration.
        type: string

