$schema: http://json-schema.org/draft/2020-12/schema#
$id: paleography
title: paleography.metaschema.yaml
description: |
  ...
$comment: >
  Definitions of terms:
    - client - software conforming to the specification
    - entities – MUFI entities.
    - regex template - a regex pattern containing Paleo's extended syntax, parsed to final regex pattern.
type: object
additionalProperties: false
required:
  - $schema
  - version
  - mufi-snapshot
  - regex-extensions
  - tokens
  - character-classes
  - rule-definitions
  - unicode
  - presets
  - preset
  - rules
  - fonts
properties:
  $schema:
    title: JSON Schema ID.
    description: ID of JSON Schema this file complies to.
    $comment: >
      The 'const' value is overriden by the `build.ts` script with the value of
      the most up-to-date schema adress.

      This value is ALWAYS a JSON Schema file, not YAML! Your YAML interpreter
      should allow you for accepting JSON Schemas.

      ONLY IF THIS IS NOT THE CASE, you MAY use metaschema's YAML file.
    type: string
    const: https://raw.githubusercontent.com/Early-Music-Typesetting/paleography/refs/heads/main/paleography.metaschema.json
  version:
    title: Version
    description: Version of the Paleography specification.
    $comment: |
      Specification inherts it's version number from `package.json` version.
      The schema and metaschema should have the same version.
    examples:
      - 0.5.1
    type: string
    const: 0.9.1
  mufi-snapshot:
    title: MUFI Snapshot
    description: >
      MUFI Snapshot file consulted for providing information about entities and
      UTF-8 glyphs.
    type: object
    additionalProperties: false
    required:
      - url
      - date
    properties:
      url:
        title: MUFI Snapshot URL
        description: |
          The source of the MUFI snapshot.
        type: string
        format: uri
        const: https://mufi.info/q.php?q=mufiexport
      date:
        title: MUFI Snapshot date
        description: |
          A timestampt when the MUFI snapshot was visited.
        examples:
          - 2026-10-23T13:59:08.045Z
        $comment: |
          The 'const' value of this property should be set by the built script.
        type: string
        format: timestamp
        pattern: "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9\
          ][0-9](\\.[0-9]*[1-9])?Z"
        const: 2026-10-24T02:44:34.319Z
  regex-extensions:
    title: Regex extensions
    description: >
      Additional syntax used in templating regex formulas.

      Those extensions needs to be implemented by client and matched over
      `pattern` fields.

      NOTE: those extensions are additionally enforced by the metaschema and
      should reflect values defined in metaschema.
    type: object
    additionalProperties: false
    required:
      - paleo-class
      - mufi-char
      - token-char
      - definition-ref
      - group-ref
    properties:
      paleo-class:
        title: Paleo character class
        description: >
          POSIX-inspired character class syntax defined in Paleo or by user.

          It allows to provide a shortcut to custom-defined character regex
          classes (such as MUFI's character classes).
        examples:
          - "[:myclass:]"
        type: object
        additionalProperties: false
        required:
          - pattern
        properties:
          pattern:
            type: string
            format: regex
            const: \[:([a-z]+|\*+|\<|\>|\[|\]|!|\\):\]
      mufi-char:
        title: MUFI character class
        description: >
          A character class defined as tag in MUFI containing a regex pattern
          for the whole tag's content match.
        examples:
          - \m{R}
          - \m{Greek}
          - \m{- abbr}
        type: object
        additionalProperties: false
        required:
          - pattern
        properties:
          pattern:
            type: string
            format: regex
            const: \m{([A-Z]|- )[a-z]*}
      token-char:
        title: Paleo token character class
        description: >
          Recall character representing Paleo's token.

          User can set their own characters as token's. This functionality
          ensures that this user's intervention is always reflected in Paleo's
          rule-definitions regex templating.
        examples:
          - \t{change}
        type: object
        additionalProperties: false
        required:
          - pattern
        properties:
          pattern:
            title: Paleo token character class regex extension pattern.
            description: >
              This pattern MUST contain all the tokens defined in
              '#/properties/tokens'.
            type: string
            format: regex
            const: \t{(change|abbreviate-start|abbreviate-end|ommit-start|ommit-end|expand|macro-start)}
      definition-ref:
        title: List item reference
        description: >
          Insert an elsewhere-defined subpattern into pattern by it's index
          (1-based).
        examples:
          - "#1"
        type: object
        additionalProperties: false
        required:
          - pattern
        properties:
          pattern:
            const: "#\\d+"
      group-ref:
        title: Regex captured group reference ('backreference')
        description: >
          Insert result of a regex capture group match into string.

          Groups have 1-based index. Group `\0` returns the whole matched
          string.
        examples:
          - \1
          - \2
        type: object
        additionalProperties: false
        required:
          - pattern
        properties:
          pattern:
            const: \\d+
  tokens:
    title: Tokens
    description: All the special tokens defined by this specification.
    type: object
    additionalProperties: false
    required:
      - change
      - abbreviate-start
      - abbreviate-end
      - ommit-start
      - ommit-end
      - expand
      - macro-start
    properties:
      change:
        title: Change
        description: Token indicating substitution of one or more characters.
        $ref: "#/$defs/token"
        example:
          - "*"
      abbreviate-start:
        title: "Abbreviate: start"
        description: Token starting abbreviation
        $ref: "#/$defs/token"
        example:
          - <
      abbreviate-end:
        title: "Abbreviate: end"
        description: Token ending abbreviation
        $ref: "#/$defs/token"
        example:
          - ">"
      ommit-start:
        title: "Ommission: start"
        description: Token starting ommission
        $ref: "#/$defs/token"
        example:
          - "["
      ommit-end:
        title: "Ommission: end"
        description: Token ending ommission
        $ref: "#/$defs/token"
        example:
          - "]"
      expand:
        title: Expand
        description: This token tells client to ignore the effects of another token
          while the text remains annotated.
        $ref: "#/$defs/token"
        example:
          - "!"
      macro-start:
        title: "Macro: start"
        description: This character introduces macro.
        $ref: "#/$defs/token"
        example:
          - \
  character-classes:
    type: object
    title: Paleo character classes
    description: >
      Character classes that can be used with substitution regex templates.

      You can access them using Posix-inspired class syntax.

      IMPORTANT: when using character class based based on Paleo tokens in your
      regex templates, you MUST use the original characters (defined here) and
      not user-definable token characters in `tokens`.
    examples:
      - "[:*:]"
      - "[:vowel:]"
    required:
      - "*"
      - <
      - ">"
      - "["
      - "]"
      - "!"
      - \
      - vowel
    additionalProperties: false
    patternProperties:
      "[a-z]+":
        title: Custom character class.
        description: User-defined character class
        type: string
        format: regex
    properties:
      "*":
        title: '"Change token" character class'
        description: "(See #/tokens/change)."
        const: \t{change}
      <:
        title: '"Abbreviation-start token" character class'
        description: "(See #/tokens/abbreviate-start)."
        const: \t{abbreviate-start}
      ">":
        title: '"Abbreviation-end token" character class'
        description: "(See #/tokens/abbreviate-end)."
        const: \t{abbreviate-end}
      "[":
        title: '"Ommission-start token" character class'
        description: "(See #/tokens/ommit-start)."
        const: \t{ommit-start}
      "]":
        title: '"Ommission-end token" character class'
        description: "(See #/tokens/ommit-end)."
        const: \t{ommit-end}
      "!":
        title: '"Expand token" character class'
        description: "(See #/tokens/expand)."
        const: \t{expand}
      \:
        title: '"Macro-start token" character class'
        description: "(See #/tokens/macro-start)."
        const: \t{macro-start}
  rule-definitions:
    title: Rule definitions
    description: |
      All the rule definitions that can be used in `rules`.
    type: object
    patternProperties:
      ^([a-z]+-)*[a-z]+$:
        oneOf:
          - $ref: "#/$defs/rule-definition"
          - $ref: "#/$defs/rule-deprecation"
  unicode:
    title: Unicode characters
    description: >
      Unicode characters mapped to MUFI entities.

      User can override such a mapping if needs to use alternative Unicode
      characters for their client. This is *not* recommended unless the
      characters are used only for the sake of display (e.g. to supply dummies
      for missing MUFI codepoints).
    $comment: >
      For now, only MUFI characters included in MUFI export are provided. TODO:
      Other characters (e.g. Greek).
    type: object
    properties: {}
  presets:
    title: Presets
    description: |
      A preset is a set of rules. They can still be overriden at `rules`.
    $comment: |
      This schema should be autogenerated based on `#/properties/rules`.
    type: object
    patternProperties:
      ^([a-z]+-)*[a-z]+$:
        $ref: "#/properties/rules"
    properties:
      medieval:
        $ref: "#/properties/rules"
      renaissance:
        $ref: "#/properties/rules"
  preset:
    title: Preset selected
    description: |
      Preset selected. Preset's rules can be still overriden at `rules`.
    $comment: >
      Enum for this schema should be autogenerated based on `#/properties/rules`.
    type:
      - string
      - "null"
    enum:
      - null
      - medieval
      - renaissance
  rules:
    title: Rules
    description: |
      All availablle pre-defined rules and their settings.
    $comment: >
      This schema should be autogenerated based on
      `#/properties/rule-definitions`.
    type: array
    uniqueItems: true
    unevaluatedItems:
      title: Custom rules
      description: >
        User-defined custom rules. Custom rules defined by user at
        `rule-definitions`.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
    items:
      title: Rule
      description: A rule defined in `#/properties/rule-definitions`
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      patternProperties:
        ^([a-z]+-)*[a-z]+$:
          title: Custom rule
          description: User-defined custom rule. Custom rules defined by user in
            `#/properties/rule-definitions`.
          type: string
          pattern: ^([a-z]+-)*[a-z]+$
      properties:
        bus-final:
          title: Final "-bus"
          description: ""
          type: string
          enum:
            - always
            - indicated
            - never
        christ-xp:
          title: Christ- expressed as "chi-rho".
          description: ""
          type: string
          enum:
            - always
            - indicated
            - never
        christ-x:
          title: Christ- expressed as "chi" alone.
          description: ""
          type: string
          enum:
            - always
            - indicated
            - never
        con-initial:
          title: initial "con" or "com"
          description: >
            There are a few ways initial "con" is abbreviated:
              - `ꝯ` – most typical.
              - `ↄ` – reversed "c" (with or without dot inside)
              - `ɔ` – open `o`. NOTE: MUFI allows it, but reccomends to use "reversed c" instead.
          type: string
          enum:
            - always
            - indicated
            - never
        et-final:
          title: Final "et"
          description: ""
          type: string
          enum:
            - always
            - indicated
            - never
        est-final:
          title: Final "est"
          description: ""
          type: string
          enum:
            - always
            - indicated
            - never
        i-dotless:
          title: A small 'i' without a dot (tittle).
          description: |
            Many scripts do not provide a dot (tittle) over i.
          type: string
          enum:
            - always
            - indicated
            - never
        i-initial-enlarged:
          title: Initial small "i" enlarges.
          description: >
            It is not yet clear wether this character should be represented by
            Unicode/MUFI "epigraphic I longa" `ꟾ` or MUFI's "enlarged small
            dotless i" ``.

            Wikipedia hints for Long_I, but only for late Roman and early
            medieval scripts: ttps://en.wikipedia.org/wiki/Long_I Examples
            contain an early XVI c. bastarda / fraktur (???) script from ILVB
            158.

            As of MUFI 3.0, "enlarged small dotless i" is not a part of unicode,
            thus we recommend using the "epigraphic" i until it's included.
          type: string
          enum:
            - always
            - indicated
        m-final:
          title: Final "m".
          description: |
            Usually final "-am", "-em" or "-um".
          type: string
          enum:
            - always
            - indicated
            - never
        nasal:
          title: Nasal stroke
          description: |
            This is one of the most common scriptural abbreviation.
          type: string
          enum:
            - always
            - indicated
            - never
        onem-final:
          title: Final "-onem"
          description: ""
          type: string
          enum:
            - always
            - indicated
            - never
        que-final:
          title: Final "que"
          description: |
            TO DO: verify whether it is only in final position.
          type: string
          enum:
            - always
            - indicated
            - never
        r-rotunda:
          title: Variant of 'r' before "round" letters.
          description: >
            Different types have different definitions of what a "round" letter
            is. For gothic scripts its "o", "b", "p", "h", "w". Fraktur also has
            round "d"
          type: string
          enum:
            - always
            - auto
            - indicated
            - never
        s-long:
          title: Long s
          description: |
            This is the prevailing variant of small s in old scripts.
          type: string
          enum:
            - always
            - auto
            - indicated
            - never
        us-final:
          title: Final -us or -er (ending of nominative 2nd declention)
          description: ""
          type: string
          enum:
            - always
            - indicated
        v-round:
          title: Round variant of "v".
          description: >
            Most old scripts do not distinguish between "v" and "u" (in a
            similar way that some modern Latin conventions do not distinguish
            between "i" and "j").
          type: string
          enum:
            - always
            - indicated
            - never
        y-dotted:
          title: Dots over "y".
          description: ""
          type: string
          enum:
            - always-single
            - indicated-single
            - always-double
            - indicated-double
            - auto
            - never
        christ:
          description: >
            For "x" use "christ-x" and mark abbreviation "ch*<rist..>..". For
            "xp", use "christ-xp" and mark special abbreviation
            ("chr*<ist..>..").
          type: string
        i-initial-capitalized:
          description: use `i-initial-enlarged`
          type: string
        v-as-u:
          description: use `v-round`
          type: string
  fonts:
    title: Fonts settings
    description: |
      Fonts settings containing information about font-specific substitutions.
    additionalProperties:
      title: Font settings
      description: |
        Font settings containing information about font-specific substitutions.
      type: object
      additionalProperties: false
      properties:
        character-classes:
          title: Character classes redefinitions
          description: Redefining character classes.
          $comment: Autopopulated at build.
          properties:
            vowel:
              type: string
              format: regex
              default: "[\\m{A}\\m{E}\\m{I}\\m{O}\\m{U}\\m{Y}]"
            roudletter:
              type: string
              format: regex
              default: "[\\m{O}\\m{B}\\m{P}\\m{H}\\m{W}]"
        entities:
          title: Entity characters
          description: Characters mapped to rule's entities.
          $comment: Autopopulated at build.
          properties:
            bus-final:
              title: Final "-bus"
              description: ""
              type: array
              prefixItems:
                - title: etfin
                  type: string
                  default: ꝫ
            christ-xp:
              title: Christ- expressed as "chi-rho".
              description: ""
              type: array
              prefixItems:
                - title: chi
                  type: string
                - title: rho
                  type: string
            christ-x:
              title: Christ- expressed as "chi" alone.
              description: ""
              type: array
              prefixItems:
                - title: chi
                  type: string
            con-initial:
              title: initial "con" or "com"
              description: >
                There are a few ways initial "con" is abbreviated:
                  - `ꝯ` – most typical.
                  - `ↄ` – reversed "c" (with or without dot inside)
                  - `ɔ` – open `o`. NOTE: MUFI allows it, but reccomends to use "reversed c" instead.
              type: array
              prefixItems:
                - title: condes
                  type: string
                  default: ꝯ
                - title: conbase
                  type: string
                  default: ↄ
                - title: condot
                  type: string
                  default: ꜿ
            et-final:
              title: Final "et"
              description: ""
              type: array
              prefixItems:
                - title: etfin
                  type: string
                  default: ꝫ
            est-final:
              title: Final "est"
              description: ""
              type: array
              prefixItems:
                - title: etfin
                  type: string
                  default: ꝫ
            i-dotless:
              title: A small 'i' without a dot (tittle).
              description: |
                Many scripts do not provide a dot (tittle) over i.
              type: array
              prefixItems:
                - title: inodot
                  type: string
                  default: ı
            i-initial-enlarged:
              title: Initial small "i" enlarges.
              description: >
                It is not yet clear wether this character should be represented
                by Unicode/MUFI "epigraphic I longa" `ꟾ` or MUFI's "enlarged
                small dotless i" ``.

                Wikipedia hints for Long_I, but only for late Roman and early
                medieval scripts: ttps://en.wikipedia.org/wiki/Long_I Examples
                contain an early XVI c. bastarda / fraktur (???) script from
                ILVB 158.

                As of MUFI 3.0, "enlarged small dotless i" is not a part of
                unicode, thus we recommend using the "epigraphic" i until it's
                included.
              type: array
              prefixItems:
                - title: Ilong
                  type: string
                  default: ꟾ
                - title: inodotenl
                  type: string
                  default: 
            m-final:
              title: Final "m".
              description: |
                Usually final "-am", "-em" or "-um".
              type: array
              prefixItems:
                - title: etfin
                  type: string
                  default: ꝫ
            nasal:
              title: Nasal stroke
              description: |
                This is one of the most common scriptural abbreviation.
              type: array
              prefixItems:
                - title: bar
                  type: string
                  default: ̅
            onem-final:
              title: Final "-onem"
              description: ""
              type: array
              prefixItems:
                - title: etfin
                  type: string
                  default: ꝫ
            que-final:
              title: Final "que"
              description: |
                TO DO: verify whether it is only in final position.
              type: array
              prefixItems:
                - title: etfin
                  type: string
                  default: ꝫ
            r-rotunda:
              title: Variant of 'r' before "round" letters.
              description: >
                Different types have different definitions of what a "round"
                letter is. For gothic scripts its "o", "b", "p", "h", "w".
                Fraktur also has round "d"
              type: array
              prefixItems:
                - title: rrot
                  type: string
                  default: ꝛ
            s-long:
              title: Long s
              description: |
                This is the prevailing variant of small s in old scripts.
              type: array
              prefixItems:
                - title: slong
                  type: string
                  default: ſ
            us-final:
              title: Final -us or -er (ending of nominative 2nd declention)
              description: ""
              type: array
              prefixItems:
                - title: usmod
                  type: string
                  default: ꝰ
            v-round:
              title: Round variant of "v".
              description: >
                Most old scripts do not distinguish between "v" and "u" (in a
                similar way that some modern Latin conventions do not
                distinguish between "i" and "j").
              type: array
            y-dotted:
              title: Dots over "y".
              description: ""
              type: array
              prefixItems:
                - title: ydot
                  type: string
                  default: ẏ
                - title: yuml
                  type: string
                  default: ÿ
            christ:
              description: >
                For "x" use "christ-x" and mark abbreviation "ch*<rist..>..".
                For "xp", use "christ-xp" and mark special abbreviation
                ("chr*<ist..>..").
              type: array
            i-initial-capitalized:
              description: use `i-initial-enlarged`
              type: array
            v-as-u:
              description: use `v-round`
              type: array
$defs:
  token:
    type: string
    maxLength: 1
  rulename:
    title: Rule name
    description: Rule unique identifier.
    type: string
    examples:
      - rule
      - my-rule
    pattern: ^([a-z]+-)*[a-z]+$
  rule-definition:
    title: Rule Definition
    description: >
      Definition of a spelling rule available in `rules`.

      In a rule definition you provide:
        - description and example from a real source,
        - which MUFI entities are being used,
        - what sequence is matched,
        - list of 'settings' keywords how the sequence is substituted,

      When a rule is executed, client compiles a regex from
      `./substitutions/pattern`'s template by repalcing Paleo character classes
      with requested characters (from the default `#/character-classes` or font
      settings.

      When a match is found, it is replaced by the 'result' string. This string
      is itself assembled from characters mapped to MUFI entities and pattern's
      group captures (if any)

      A rule tells client how to substitute original text characters based on
      the rule's setting, tokens used and font config.
    type: object
    additionalProperties: false
    required:
      - description
      - remarks
      - examples
      - class
      - entities
      - substitutions
      - settings
    properties:
      description:
        title: Rule description
        description: |
          A short explanatory note about the rule
        type: string
      remarks:
        title: Rule remarks
        description: >
          Additional commentary on rule's background, implementation,
          palaeographic resources etc.
        type: string
      examples:
        title: Examples
        description: >
          Examples of existing documents where the rule might apply containt an
          example Paleo encoding.
        type: array
        $comment: |
          In future, providing at least one example will be obligatory.
        items:
          $ref: "#/$defs/source-snippet"
      class:
        title: Substitution Class
        description: What kind of substitution is performed.
        anyOf:
          - const: allograph
            description: A glyph expanding to another (and only 1) glyph.
          - const: abbreviation
            description: A glyph expanding to more than 1 standard letter.
          - const: contraction
            description: A glyph modifier signalising contraction or ommission of letters.
          - const: mixed
            description: A glyph expressing both allograph/abbreviation and contraction.
          - const: ligature
            description: Two or more glyphs joined together but clearly distinguishible.
      entities:
        title: MUFI entities
        description: |
          ...
        type: array
        items:
          title: MUFI entity
          description: A MUFI entity (`ent` value, without initial ampersand '&').
          $comment: >
            Build scripts appends here the 'enum' property containing all legal
            MUFI entity names.
          type: string
          pattern: "[a-zA-Z]+"
          enum:
            - sp
            - excl
            - quot
            - num
            - dollar
            - percnt
            - amp
            - apos
            - lpar
            - rpar
            - ast
            - plus
            - comma
            - hyphen
            - period
            - sol
            - colon
            - semi
            - lt
            - equals
            - gt
            - quest
            - commat
            - lsqb
            - bsol
            - rsqb
            - circ
            - lowbar
            - grave
            - lcub
            - verbar
            - rcub
            - tld
            - nbsp
            - iexcl
            - cent
            - pound
            - curren
            - yen
            - brvbar
            - sect
            - uml
            - copy
            - ordf
            - laquo
            - not
            - shy
            - reg
            - macr
            - deg
            - plusmn
            - sup2
            - sup3
            - acute
            - micro
            - para
            - middot
            - cedil
            - sup1
            - ordm
            - raquo
            - frac14
            - frac12
            - frac34
            - iquest
            - Agrave
            - Aacute
            - Acirc
            - Atilde
            - Auml
            - Aring
            - AElig
            - Ccedil
            - Egrave
