$schema: "./paleography.metaschema.yaml"

version: "0.3.1"

# TO DO:
# - 'pattern' must contain a metacharacter.


#   LETTER: "[]"
#   substitute(str): /{{str}}/
#   substitute-except-last(str): /{{str}}(?={{LETTER}})/


regexp-extensions:

  value(property): #"{{v}}"
    doc: >
      Allowing insertion of paleo spec's property value into regexp
      using mustache-like braces and JSON-schema's reference path.

      Property's value needs a check wether it should be escaped
      (e.g. it can be a special Regex character).
    argumentPattern: "#/metacharacters/[a-z-]+"
    evaluation:
      $ref: property
    signature: "{{{{property}}}}"
    example: "{{#/metacharacters/change}}"

  class(characterClassProperty):
    doc: >
      Define a POSIX-like class of characters.

      This is needed, because we used various extensions of Unicode
      that might go beyond typical implementations of '.', '\p{}' etc.
      For example, MUFI proposes their own Regexp patterns to match
      all the flavours of a basic graph. See example:
      https://www.mufi.info/q.php?p=mufi/browse/tag/17
    argumentPattern: ...
    evaluation: value(#/character-classes/{{characterClassProperty}})
    signature: "\\[:{{characterClassProperty}}:\\]"
    example: "[:*:]"

metacharacters:

  change: "*"
  abbreviate-start: "<"
  abbreviate-end: ">"
  ommit-start: "["
  ommit-end: "]"
  expand: "!"
  macro-start: "\\"

character-classes:

  "*": "{{#/metacharacters/change}}"
  "<": "{{#/metacharacters/abbreviate-start}}"
  ">": "{{#/metacharacters/abbreviate-end}}"
  "[": "{{#/metacharacters/ommit-start}}"
  "]": "{{#/metacharacters/abbreviate-end}}"
  "!": "{{#/metacharacters/expand}}"
  "\\": "{{#/metacharacters/macro-start}}"

  # TO DO: add regexp's from MUFI for the symbols below:
  vowel: [aeiouy]

  # TO DO: those should be definiable by font!
  roudletter: "[obphw]" # Fractur has also "d"


rule-definitions:

  # A user interface to macra substitutions.
  # Substitution names can be modified:
  # 1) '-' before, after or both: pre-, in- or suffix.
  # 2) '*' after name: substitution is triggered by 'change' metacharacter.

  # christ
  # que
  # quem
  # nasals
  # er-final
  # us-final
  # rum-final
  # et-final
  # con
  # pro
  # per
  # ignored-abbreviation
  # i-abbreviation
  # abbreviation
  #
  #   christi
  #   C*hr<ist>i

  # Final -ꝫ:
  # https://en.wiktionary.org/wiki/ꝫ

  # TO DO: final "fancy" curved s.
  # u-angled:

  christ-xp:
    description: Christ- expressed as "chi-rho".
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: mixed # abbreviation? contraction?
    characters:
      - base: ch
        char: χ
        mufi:
      - base: r
        char: ρ
        mufi:
    substitutions:
      - pattern: "#1#2[:*:]([:<:]ist.*[:>:])"
        result: "#1#2\\1"
    settings:
      always: ["#1-"]
      indicated: ["#1-*"]
      never: []

  christ-x:
    description: Christ- expressed as "chi" alone.
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: mixed # abbreviation? contraction?
    characters:
      - base: ch
        char: χ
        mufi:
    substitutions:
      - pattern: "#1[:*:]([:<:]rist.*[:>:])"
        result: "#1\\1"
    settings:
      always: ["#1-"]
      indicated: ["#1-*"]
      never: []

  et-final:
    description: Final "et"
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: abbreviation
    characters:
      - base: et
        char: ꝫ
        mufi: etfin
    substitutions:
      - pattern: e[:*:]t
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  est-final:
    description: Final "est"
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: abbreviation
    characters:
      - base: est
        char: ꝫ
        mufi: etfin
    substitutions:
      - pattern: e[:*:]st
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  que-final:
    description: Final "que"
    remarks: >
      TO DO: verify whether it is only in final position.
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: abbreviation
    characters:
      - base: que
        char: qꝫ
        mufi: etfin
    substitutions:
      - pattern: q[:*:]ue
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  bus-final:
    description: Final "-bus"
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: abbreviation
    characters:
      - base: us
        char: ꝫ
        mufi: etfin
    substitutions:
      - pattern: b[:*:]us
        result: "b#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  onem-final:
    description: Final "-onem"
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: abbreviation
    characters:
      - base: em
        char: ꝫ
        mufi: etfin
    substitutions:
      - pattern: on[:*:]em
        result: "on#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  # to do:
  # tittle:
  # - dot
  # - slash (ILVB 158 etc)
  # - absent
  i-dotless:
    description: A small 'i' without a dot (tittle).
    remarks: >
      Many scripts do not provide a dot (tittle) over i.
    examples: []
    class: allograph
    characters:
    - { base: i, char: ı, mufi: inodot }
    substitutions:
    - pattern: "#1[:*:]"
      result: "#1"
    settings:
      always: ["#1"]
      indicated: ["#1*"]
      never: []

  # inodot:
  #   class: allograph
  #   pattern: i[:*:]
  #   unicode: ı
  #   mufi: inodot
  #   allographs: [i]

  i-initial-enlarged:
    description: Initial small "i" enlarges.
    remarks: >
      It is not yet clear wether this character should be represented
      by Unicode/MUFI "epigraphic I longa" `ꟾ`
      or MUFI's "enlarged small dotless i" ``.

      Wikipedia hints for Long_I, but only for late Roman and early medieval scripts: ttps://en.wikipedia.org/wiki/Long_I
      Examples contain an early XVI c. bastarda / fraktur (???) script from ILVB 158.
    examples:
    - source: ILVB 158
      link: ...
      img: ...
      script: ...
      paleo: >
        ---
        rules:
          i-initial-enlarged: indicated
        ---
        ...
    class: allograph
    characters:
    - { base: i, char: ꟾ, mufi: Ilong }
    - { base: i, char: , mufi: inodotenl }
    substitutions:
    - pattern: "#1[:*:]"
      result: "#1"
    settings:
      always: ["#1-"]
      indicated: [prefix*]

  m-final:
    description: Final "m".
    remarks: >
      Usually final "-am", "-em" or "-um".
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: allograph
    characters:
      - base: m
        char: ꝫ
        mufi: etfin
    substitutions:
      - pattern: "([:vowel:])#1[:*:]"
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []


  nasal:
    description: Nasal stroke
    remarks: >
      This is one of the most common scriptural abbreviation.
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: abbreviation
    characters:
      - base:
        char: ̅
        mufi: bar
    substitutions:
      - pattern: ([:vowel:])[:*:][mn]
        result: \1#1
    settings:
      always: ["#1"]
      indicated: ["#1"]
      never: []

  r-rotunda:
    description: Variant of 'r' before "round" letters.
    remarks: >
      Different types have different definitions of what a "round" letter is.
      For gothic scripts its "o", "b", "p", "h", "w".
      Fraktur also has round "d"
    examples: []
    class: allograph
    characters:
      - base: r
        char: ꝛ
        mufi: rrot
    substitutions:
      - pattern: ([[:roundletter:]])#1
        result: \1#1
      - pattern: "#1"
        result: "#1"
    settings:
      always: ["#2"]
      auto: ["#1"]
      indicated: ["#1*"]
      never: []

  s-long:
    description: Long s
    remarks: >
      This is the prevailing variant of small s in old scripts.
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: allograph
    characters:
      - base: s
        char: ſ
        mufi: slong
    substitutions:
      - pattern: "#1[:*:]"
        result: "#1"
    settings:
      always: ["#1"]
      auto: ["#1-", "-#1-", "-#1*"]
      indicated: ["#1*"]
      never: []

  v-round:
    description: Round variant of "v".
    remarks: >
      Most old scripts do not distinguish between "v" and "u"
      (in a similar way that some modern Latin conventions do not distinguish between "i" and "j").
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: allograph
    characters:
      - base: v
        char: u
        mufi: null
    substitutions:
      - pattern: "#1[:*:]"
        result: "#1"
    settings:
      always: ["#1"]
      indicated: ["#1*"]
      never: []

  y-dotted:
    # always-doubly: [y-dotted-doubly]
    # indicated-doubly: [y-dotted-doubly*]
    # always: [y-dotted-single]
    # indicated: [y-dotted-single*]
    # never: []
    description: Dots over "y".
    remarks: >
    examples:
      - source:
        link:
        img:
        script:
        paleo:
    class: allograph
    characters:
      - base: y
        char: ẏ # compound. single: ẏ
        mufi:
      - base: y
        char: ÿ # compound. single: ÿ
        mufi:
    substitutions:
      - pattern: y[:*:]
        result: "#1"
      - pattern: y[:*:]
        result: "#2"
    settings:
      always-single: ["#1"]
      indicated-single: ["#1*"]
      always-double: ["#2"]
      indicated-double: ["#2"]
      auto: ["#2**", "#1*"]
      never: []

  # DEPRECATED

  christ:
    deprecated: >
      For "x" use "christ-x" and mark abbreviation "ch*<rist..>..".
      For "xp", use "christ-xp" and mark special abbreviation ("chr*<ist..>..").

  i-initial-capitalized:
    deprecated: use `i-initial-enlarged`

  v-as-u:
    deprecated: use `v-round`

presets: # TO DO: metaschema

  medieval:
  - i-dotless: always
  - s-long: auto
  - et-final: indicated
  - m-final: indicated
  - nasal: indicated
  - v-round: always
  - r-rotunda: auto
  - y-dotted: always
  - christ: indicated

  renaissance:
  - s-long: auto
  - m-final: indicated
  - nasal: indicated
  - v-round: always
  - r-rotunda: auto


  # insular

fonts:
  ...
