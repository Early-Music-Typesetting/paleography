$schema: "./paleography.metaschema.yaml"

version: "0.3"

# TO DO:
# - 'pattern' must contain a metacharacter.


#   LETTER: "[]"
#   substitute(str): /{{str}}/
#   substitute-except-last(str): /{{str}}(?={{LETTER}})/


regexp-extensions:

  value(property): #"{{v}}"
    doc: >
      Allowing insertion of paleo spec's property value into regexp
      using mustache-like braces and JSON-schema's reference path.

      Property's value needs a check wether it should be escaped
      (e.g. it can be a special Regex character).
    argumentPattern: "#/metacharacters/[a-z-]+"
    evaluation:
      $ref: property
    signature: "{{{{property}}}}"
    example: "{{#/metacharacters/change}}"

  class(characterClassProperty):
    doc: >
      Define a POSIX-like class of characters.

      This is needed, because we used various extensions of Unicode
      that might go beyond typical implementations of '.', '\p{}' etc.
      For example, MUFI proposes their own Regexp patterns to match
      all the flavours of a basic graph. See example:
      https://www.mufi.info/q.php?p=mufi/browse/tag/17
    argumentPattern: ...
    evaluation: value(#/character-classes/{{characterClassProperty}})
    signature: "\\[:{{characterClassProperty}}:\\]"
    example: "[:*:]"

metacharacters:

  change: "*"
  abbreviate-start: "<"
  abbreviate-end: ">"
  ommit-start: "["
  ommit-end: "]"
  expand: "!"
  macro-start: "\\"

character-classes:

  "*": "{{#/metacharacters/change}}"
  "<": "{{#/metacharacters/abbreviate-start}}"
  ">": "{{#/metacharacters/abbreviate-end}}"
  "[": "{{#/metacharacters/ommit-start}}"
  "]": "{{#/metacharacters/abbreviate-end}}"
  "!": "{{#/metacharacters/expand}}"
  "\\": "{{#/metacharacters/macro-start}}"

  # TO DO: add regexp's from MUFI for the symbols below:
  vowel: [aeiouy]

  # TO DO: those should be definiable by font!
  roudletter: "[obphw]" # Fractur has also "d"


substitutions:

  # Final -ꝫ:
  # https://en.wiktionary.org/wiki/ꝫ

  -etfin-et:
    class: abbreviation
    pattern: e[:*:]t
    unicode: ꝫ
    mufi: etfin
    allographs: []

  -etfin-est:
    class: abbreviation
    pattern: e[:*:]st
    unicode: ꝫ
    mufi: etfin
    allographs: []

  -etfin-ue:
    class: abbreviation
    pattern: q[:*:]ue
    unicode: qꝫ
    mufi: etfin
    allographs: []

  -etfin-m:
    class: allograph
    pattern: ([aeu])[:*:]m
    unicode: \1ꝫ
    mufi: etfin
    allographs: []

  -etfin-us:
    class: abbreviation
    pattern: b[:*:]us
    unicode: bꝫ
    mufi: etfin
    allographs: []

  inodot:
    class: allograph
    pattern: i[:*:]
    unicode: ı
    mufi: inodot
    allographs: [i]

  inodotenl:
    class: allograph
    pattern: i[:*:]
    unicode: null # 
    mufi: inodotenl
    allographs: [i]

  nasal:
    class: abbreviation
    pattern: ([:vowel:])[:*:][mn]
    unicode: \1̅
    mufi: bar
    allographs: []

  rrot:
    class: allograph
    pattern: ([:roundletter:])r[:*:]
    unicode: \1ꝛ
    mufi: rrot
    allographs: [r]

  rrot-anywhere:
    class: allograph
    pattern: r[:*:]
    unicode: ꝛ
    mufi: rrot
    allographs: [r]

  slong:
    class: allograph
    pattern: s[:*:]
    unicode: ſ
    mufi: slong
    allographs: [s]

  # TO DO: final "fancy" curved s.

  v-round:
    class: allograph
    pattern: v[:*:]
    unicode: u
    mufi: null
    allographs: [v]

  y-dotted-doubly:
    class: allograph
    pattern: y[:*:]
    unicode: ÿ # compound. single: ÿ
    mufi: null
    allographs: [y]

  y-dotted-single:
    class: allograph
    pattern: y[:*:]
    unicode: ẏ # compound. single: ẏ
    mufi: null
    allographs: [y]

  # DEPRECATED

  i-initial-capitalized:
    deprecated: inodotenl

  v-as-u:
    deprecated: v-round

  # u-angled:

rule-definitions:

  # A user interface to macra substitutions.
  # Substitution names can be modified:
  # 1) '-' before, after or both: pre-, in- or suffix.
  # 2) '*' after name: substitution is triggered by 'change' metacharacter.

  i-dotless:
    always: [inodot]
    indicated: [inodot*]
    never: []

  i-initial-enlarged:
    always: [i-enlarged-]
    auto: [i-enlarged-]
    indicated: [i-enlarged-*]
    never: []

  et-final:
    always: [-etfin-et]
    indicated: [-etfin-et*]
    never: []

  m-final:
    always: [-etfin-m]
    indicated: [-etfin-m*]
    never: []

  nasal:
    always: [nasal]
    indicated: [nasal*]
    never: []

  r-rotunda:
    always: [rrot-anywhere]
    auto: [rrot]
    indicated: [rrot-anywhere*]
    never: []

  s-long:
    always: [slong]
    auto: [slong-, -slong-, -slong*]
    indicated: [slong*]
    never: []

  v-round:
    always: [v-round]
    indicated: [v-round*]
    never: []

  y-dotted:
    always-doubly: [y-dotted-doubly]
    indicated-doubly: [y-dotted-doubly*]
    always: [y-dotted-single]
    indicated: [y-dotted-single*]
    never: []

presets: # TO DO: metaschema

  medieval:
  - i-dotless: always
  - s-long: auto
  - et-final: indicated
  - m-final: indicated
  - nasal: indicated
  - v-round: always
  - r-rotunda: auto
  - y-dotted: always

  renaissance:
  - s-long: auto
  - m-final: indicated
  - nasal: indicated
  - v-round: always
  - r-rotunda: auto


  # insular

fonts:
  ...
