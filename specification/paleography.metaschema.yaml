%YAML 1.2
---
$schema: http://json-schema.org/draft/2020-12/schema#
$id: paleography

title: paleography.metaschema.yaml
description: >
  ...

$comment: >
  Definitions of terms:
    - client - software conforming to the specification
    - entities – MUFI entities.
    - regex template - a regex pattern containing Paleo's extended syntax, parsed to final regex pattern.

type: object
additionalProperties: false
required: [$schema, version, mufi-snapshot, regex-extensions, tokens, character-classes, rule-definitions, unicode, presets, preset, rules, fonts]
properties:


  $schema:
    title: JSON Schema ID.
    description: ID of JSON Schema this file complies to.
    $comment: >
      The 'const' value is overriden by the `build.ts` script
      with the value of the most up-to-date schema adress.

      This value is ALWAYS a JSON Schema file, not YAML!
      Your YAML interpreter should allow you for accepting
      JSON Schemas.

      ONLY IF THIS IS NOT THE CASE, you MAY use metaschema's YAML file.
    type: string
    const: './paleography.metaschema.yaml' # Overriden by `build.ts`.


  version:
    title: Version
    description: Version of the Paleography specification.
    $comment: >
      Specification inherts it's version number from `package.json` version.

      The schema and metaschema should have the same version.
    examples: [0.5.1]
    type: string
    const: './../package.json#/version'  # Overriden by `build.ts`.


  mufi-snapshot:
    title: MUFI Snapshot
    description: >
      MUFI Snapshot file consulted for providing information about entities and UTF-8 glyphs.
    type: object
    additionalProperties: false
    required: [url, date]
    properties:

      url:
        title: MUFI Snapshot URL
        description: >
          The source of the MUFI snapshot.
        type: string
        format: uri
        const: https://mufi.info/q.php?q=mufiexport

      date:
        title: MUFI Snapshot date
        description: >
          A timestampt when the MUFI snapshot was visited.
        examples: [2026-10-23T13:59:08.045Z]
        $comment: >
          The 'const' value of this property should be set by the built script.
        type: string
        format: timestamp
        pattern: '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9](\.[0-9]*[1-9])?Z'
        const: 0000-00-00T00:00:00.001Z



  regex-extensions:
    title: Regex extensions
    description: >
      Additional syntax used in templating regex formulas.

      Those extensions needs to be implemented by client
      and matched over `pattern` fields.

      NOTE: those extensions are additionally enforced by the metaschema
      and should reflect values defined in metaschema.
    type: object
    additionalProperties: false
    required: [paleo-class, mufi-char, token-char, definition-ref, group-ref]
    properties:
      paleo-class:
        title: Paleo character class
        description: >
          POSIX-inspired character class syntax defined in Paleo or by user.

          It allows to provide a shortcut to custom-defined
          character regex classes (such as MUFI's character classes).
        examples: ['[:myclass:]']
        type: object
        additionalProperties: false
        required: [pattern]
        properties:
          pattern:
            type: string
            format: regex
            const: '\[:([a-z]+|\*+|\<|\>|\[|\]|!|\\):\]'

      mufi-char:
        title: MUFI character class
        description: >
          A character class defined as tag in MUFI
          containing a regex pattern for the whole tag's content match.
        examples: ['\m{R}', '\m{Greek}', '\m{- abbr}']
        type: object
        additionalProperties: false
        required: [pattern]
        properties:
          pattern:
            type: string
            format: regex
            const: '\m{([A-Z]|- )[a-z]*}'

      token-char:
        title: Paleo token character class
        description: >
          Recall character representing Paleo's token.

          User can set their own characters as token's.
          This functionality ensures that this user's intervention
          is always reflected in Paleo's rule-definitions regex templating.
        examples: ['\t{change}']
        type: object
        additionalProperties: false
        required: [pattern]
        properties:
          pattern:
            title: Paleo token character class regex extension pattern.
            description: >
              This pattern MUST contain all the tokens defined in '#/properties/tokens'.
            type: string
            format: regex
            const:  \t{(change|abbreviate-start|abbreviate-end|ommit-start|ommit-end|expand|macro-start)}

      definition-ref:
        title: List item reference
        description: >
          Insert an elsewhere-defined subpattern into pattern by it's index (1-based).
        examples: ['#1']
        type: object
        additionalProperties: false
        required: [pattern]
        properties:
          pattern:
            const: '#\d+'

      group-ref:
        # anyOf:
        #   - $ref: '#/$defs/regex-extension'
        title: Regex captured group reference ('backreference')
        description: >
          Insert result of a regex capture group match into string.

          Groups have 1-based index. Group `\0` returns the whole matched string.
        examples: [\1, \2]
        type: object
        additionalProperties: false
        required: [pattern]
        properties:
          pattern:
            const: '\\d+'


  tokens:
    title: Tokens
    description: All the special tokens defined by this specification.
    type: object
    additionalProperties: false
    required: [change, abbreviate-start, abbreviate-end, ommit-start, ommit-end, expand, macro-start]
    properties:
      change:
        title: Change
        description: Token indicating substitution of one or more characters.
        $ref: '#/$defs/token'
        example: ['*']
      abbreviate-start:
        title: 'Abbreviate: start'
        description: Token starting abbreviation
        $ref: '#/$defs/token'
        example: ['<']
      abbreviate-end:
        title: 'Abbreviate: end'
        description: Token ending abbreviation
        $ref: '#/$defs/token'
        example: ['>']
      ommit-start:
        title: 'Ommission: start'
        description: Token starting ommission
        $ref: '#/$defs/token'
        example: ['[']
      ommit-end:
        title: 'Ommission: end'
        description: Token ending ommission
        $ref: '#/$defs/token'
        example: [']']
      expand:
        title: Expand
        description: This token tells client to ignore the effects of another token while the text remains annotated.
        $ref: '#/$defs/token'
        example: ['!']
      macro-start:
        title: 'Macro: start'
        description: This character introduces macro.
        $ref: '#/$defs/token'
        example: [\]


  character-classes:
    type: object
    title: Paleo character classes
    description: >
      Character classes that can be used with substitution regex templates.

      You can access them using Posix-inspired class syntax.

      IMPORTANT: when using character class based based on Paleo tokens in your regex templates,
      you MUST use the original characters (defined here) and not user-definable token characters in `tokens`.
    examples: ['[:*:]', '[:vowel:]']
    required:
      - '*'
      - <
      - '>'
      - '['
      - ']'
      - '!'
      - \
      - vowel
    additionalProperties: false
    patternProperties:
      '[a-z]+':
        title: Custom character class.
        description: User-defined character class
        type: string
        format: regex
    properties:
      "*":
        title: '"Change token" character class'
        description: '(See #/tokens/change).'
        const: \t{change}
      "<":
        title: '"Abbreviation-start token" character class'
        description: '(See #/tokens/abbreviate-start).'
        const: \t{abbreviate-start}
      ">":
        title: '"Abbreviation-end token" character class'
        description: '(See #/tokens/abbreviate-end).'
        const: \t{abbreviate-end}
      "[":
        title: '"Ommission-start token" character class'
        description: '(See #/tokens/ommit-start).'
        const: \t{ommit-start}
      "]":
        title: '"Ommission-end token" character class'
        description: '(See #/tokens/ommit-end).'
        const: \t{ommit-end}
      "!":
        title: '"Expand token" character class'
        description: '(See #/tokens/expand).'
        const: \t{expand}
      "\\":
        title: '"Macro-start token" character class'
        description: '(See #/tokens/macro-start).'
        const: \t{macro-start}
      # vowel:
      #   title: Any vowel
      #   description: Any vowel.
      #   default: '[\m{A}\m{E}\m{I}\m{O}\m{U}\m{Y}]'


  rule-definitions:
    title: Rule definitions
    description: >
      All the rule definitions that can be used in `rules`.
    type: object
    patternProperties:
      "^([a-z]+-)*[a-z]+$":
        oneOf:
        - $ref: '#/$defs/rule-definition'
        - $ref: '#/$defs/rule-deprecation'

  unicode:
    title: Unicode characters
    description: >
      Unicode characters mapped to MUFI entities.

      User can override such a mapping if needs to use
      alternative Unicode characters for their client.
      This is *not* recommended unless the characters are used
      only for the sake of display (e.g. to supply dummies for missing MUFI codepoints).
    $comment: >
      For now, only MUFI characters included in MUFI export are provided.
      TODO: Other characters (e.g. Greek).
    type: object
    properties: {}


  presets:
    title: Presets
    description: >
      A preset is a set of rules. They can still be overriden at `rules`.
    $comment: >
       This schema should be autogenerated based on `#/properties/rules`.
    type: object
    patternProperties:
      "^([a-z]+-)*[a-z]+$":
        $ref: "#/properties/rules"
    properties: {}
      # medieval:
      #   $ref: "#/properties/rules"

  preset:
    title: Preset selected
    description: >
      Preset selected. Preset's rules can be still overriden at `rules`.
    $comment: >
      Enum for this schema should be autogenerated based on `#/properties/rules`.
    type: [string, "null"]
    enum: []


  rules:
    title: Rules
    description: >
      All availablle pre-defined rules and their settings.
    $comment: >
      This schema should be autogenerated based on `#/properties/rule-definitions`.
    type: array
    uniqueItems: true

    unevaluatedItems:
      title: Custom rules
      description: >
        User-defined custom rules.
        Custom rules defined by user at `rule-definitions`.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1

    items:
      title: Rule
      description: A rule defined in `#/properties/rule-definitions`
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      patternProperties:
        "^([a-z]+-)*[a-z]+$":
          title: Custom rule
          description:
            User-defined custom rule.
            Custom rules defined by user in `#/properties/rule-definitions`.
          type: string
          pattern: "^([a-z]+-)*[a-z]+$"

      properties: {}
        # For example:
        # i-dotless:
        #   title: Setting
        #   description: Setting defined in `#/properties/rule-definitions/settings`
        #   type: string
        #   enum: [always, auto, indicated, never]

  fonts:
    title: Fonts settings
    description: >
      Fonts settings containing information about font-specific substitutions.
    additionalProperties:
      title: Font settings
      description: >
        Font settings containing information about font-specific substitutions.
      type: object
      additionalProperties: false
      properties:
        character-classes:
          title: Character classes redefinitions
          description: Redefining character classes.
          $comment: Autopopulated at build.
          properties: {} # Character classes (non-paleo).
        entities:
          title: Entity characters
          description: Characters mapped to rule's entities.
          $comment: Autopopulated at build.
          properties: {} # Entities per rule.

    # Fraktur:
    #   character-classes:
    #     roudletter: '[\m{O}\m{B}\m{P}\m{H}\m{W}\m{D}]'
    #   entities:
    #     s-long: [$]



$defs:

  token:
    # title: Token
    # description: A character that triggers a modification of the input text according to the rules.
    type: string
    maxLength: 1

  rulename:
    title: "Rule name"
    description: "Rule unique identifier."
    type: string
    examples: ["rule", "my-rule"]
    pattern: '^([a-z]+-)*[a-z]+$'

  rule-definition:
    title: Rule Definition
    description: >
      Definition of a spelling rule available in `rules`.

      In a rule definition you provide:
        - description and example from a real source,
        - which MUFI entities are being used,
        - what sequence is matched,
        - list of 'settings' keywords how the sequence is substituted,

      When a rule is executed, client compiles a regex from `./substitutions/pattern`'s template
      by repalcing Paleo character classes with requested characters
      (from the default `#/character-classes` or font settings.

      When a match is found, it is replaced by the 'result' string.
      This string is itself assembled from characters mapped to MUFI entities
      and pattern's group captures (if any)

      A rule tells client how to substitute original text characters
      based on the rule's setting, tokens used and font config.
    type: object
    additionalProperties: false
    required: [description, remarks, examples, class, entities, substitutions, settings]
    properties:

      description:
        title: Rule description
        description: >
          A short explanatory note about the rule
        type: string

      remarks:
        title: Rule remarks
        description: >
          Additional commentary on rule's background, implementation, palaeographic resources etc.
        type: string

      examples:
        title: Examples
        description: >
          Examples of existing documents where the rule might apply
          containt an example Paleo encoding.
        type: array
        # minItems: 1
        $comment: >
          In future, providing at least one example will be obligatory.
        items:
          $ref: "#/$defs/source-snippet"

      class:
        title: Substitution Class
        description: What kind of substitution is performed.
        anyOf:
        - const: allograph
          description: A glyph expanding to another (and only 1) glyph.
        - const: abbreviation
          description: A glyph expanding to more than 1 standard letter.
        - const: contraction
          description: A glyph modifier signalising contraction or ommission of letters.
        - const: mixed
          description: A glyph expressing both allograph/abbreviation and contraction.
        - const: ligature
          description: Two or more glyphs joined together but clearly distinguishible.
          # TO DO: kissing, touching.

      entities:
        title: MUFI entities
        description: >
          ...
        type: array
        items:
          title: MUFI entity
          description:
            A MUFI entity (`ent` value, without initial ampersand '&').
          $comment: >
            Build scripts appends here the 'enum' property containing all legal MUFI entity names.
          type: string
          pattern: '[a-zA-Z]+'
          # enum: []

      substitutions:
        title: Substitutions
        description: Substitution performed by the rule application.
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [pattern, result]
          properties:
            pattern:
              title: Pattern (regex template)
              description: >
                Pattern to be matched. It consists of a modified regex:
                  - use `#1` etc to select entity,
                  - use capturing groups,
                  - use Paleo's character classes,
                  - use custom-defined POSIX-style character classes from `character-classes`.
                Note: avoid using advanced regex features like non-capturing groups etc. Some implementations (like POSIX) do not support them.
              type: string
              format: regex+
            result:
              title: Substitution result
              description: >
                How the substitution result looks.
                * use `#1` to select entity.
                * use `\1` to select group (captured in pattern).
              type: string

      settings:
        title: Settings
        description: A definition of rule setting consists of a list of substitutions.
        type: object
        patternProperties:
          $always(-[a-z])+:
            title: Substitute always
            description: Target all pattern matches. If they are marked with `change` token, do not substitute.
            $ref: "#/$defs/rule-setting"
          indicated(-[a-z])+:
            title: Substitute indicated
            description: Target all pattern matches if they have `change` token present.
            $ref: "#/$defs/rule-setting"
          auto(-[a-z])+:
            title: Substitute automatically
            description: Perform an automatic substitution based on the most common convention.
            $ref: "#/$defs/rule-setting"
          never:
            title: Never substitute
            description: Turn substitution off.
        additionalProperties:
          $ref: "#/$defs/rule-setting"

  rule-setting:
    title: Rule Setting
    description: >
      How the rule is executed.
      Contains a list of substitutions (performed in order they appear).
    type: array
    minContains: 0
    items:
      title: Substitution encoding
      description: >
        Evoke substitution defined in `substitutions` using `#1` notation.

        You can further restrict substitution and make it into:
        * prefix: #1-
        * infix: -#1-
        * suffix: -#1
      $comment: >
        Using `^` and `$` directly in the regex is discouraged
        because the client system can use a more complex buissness logic for determining boundaries.

        For example, (in Lilypond) a word can be sliced by syllables and whether a string contains original word boundary or not needs to determined by other means.
      examples: ["#1", "#1*", "#2-", "#2-*", "-#3-", "-#4"]
      type: string
      pattern: '^-?#\d+-?\**$'

  source-snippet:
    title: Source Snippet
    description: Description of a relevant place in sources.
    type: object
    additionalProperties: false
    required: [source, link, img, script, paleo]
    properties:
      source:
        title: Source
        description: Source identifier.
        type: string
      link:
        title: Link
        description: Link to a source (preferably to the page)
        type: string
        format: URL
      img:
        title: Image URL
        description: URL of an image containing relevant source snippet.
        type: string
        format: URI
      script:
        title: Snippet's script
        description: What kind of script/font is it.
        type: string
        $comment: Add more formalized values.
      paleo:
        title: Example of Paleo encoding
        description: >
          The Paleo representation of the text from snippet.
          It must containt only one rule (concerning this snippet)
          set to `indicated`.
        type: string
        pattern: '---\s*rules:\s*.+: indicated\s*---\s*.+'

  rule-deprecation:
    title: Rule Deprecation
    description: A deprecated rule telling software how to migrate or to throw error.
    type: object
    additionalProperties: false
    required: [deprecated, remarks, version, target]
    properties:
      deprecated:
        title: Deprecarted flag
        description: "`true` if rule definition is deprecated."
      remarks:
        title: Remarks
        description: Additional migration remarks.
      version:
        title: Deprecation Version
        description: Version since the feature became deprecated.
        type: string
        pattern: '\d+\.\d+\.\d+'
      target:
        title: Migration target
        description: Rule definition telling client which rule to use instead (null if migration is not possible).
        type: [string, "null"]
        pattern: '^-?([a-z]+-)*[a-z]+-?$'

#   rulename-prefix:
#     type: string
#     examples: ["prefix-"]
#     pattern: "-$"
#
#   rulename-infix:
#     type: string
#     examples: ["-infix-"]
#     pattern: "^-.+-$"
#
#   rulename-suffix:
#     type: string
#     examples: ["-suffix-"]
#     pattern: "^-"
#
#   rulename:
#     anyOf:
#       - $ref: "#/$defs/rulename-prefix"
#       - $ref: "#/$defs/rulename-infix"
#       - $ref: "#/$defs/rulename-suffix"
