%YAML 1.2
---
$schema: './paleography.metaschema.yaml'

version: 0.8.0

mufi-snapshot:
  url: https://mufi.info/q.php?q=mufiexport
  date: 0000-00-00

regex-extensions:

  paleo-class:
    pattern: '\[:([a-z]+|\*+|\<|\>|\[|\]|!|\\):\]'

  mufi-char:
    pattern: '\m{([A-Z]|- )[a-z]*}'

  token-char:
    pattern: \t{(change|abbreviate-start|abbreviate-end|ommit-start|ommit-end|expand|macro-start)}

  definition-ref:
    pattern: '#\d+'

  group-ref:
    pattern: '\\d+'

tokens:
  change: '*'
  abbreviate-start:  '<'
  abbreviate-end: '>'
  ommit-start: '['
  ommit-end: ']'
  expand: '!'
  macro-start: '\'

character-classes:
  '*': \t{change}
  '<': \t{abbreviate-start}
  '>': \t{abbreviate-end}
  '[': \t{ommit-start}
  ']': \t{ommit-end}
  '!': \t{expand}
  '\': \t{macro-start}
  vowel: '[\m{A}\m{E}\m{I}\m{O}\m{U}\m{Y}]'
  # TO DO: those should be definiable by font!
  roudletter: '[\m{O}\m{B}\m{P}\m{H}\m{W}]' # Fractur has also "d"

rule-definitions:

  # A user interface to macra substitutions.
  # Substitution names can be modified:
  # 1) '-' before, after or both: pre-, in- or suffix.
  # 2) '*' after name: substitution is triggered by 'change' metacharacter.

  # quem
  # rum-final
  # pro
  # per
  # ignored-abbreviation
  # i-abbreviation
  # abbreviation

  # TO DO: final "fancy" curved s. – as "enlarged S"
  # u-angled:

  bus-final:
    description: Final "-bus"
    remarks: >
    examples: []
    class: abbreviation
    entities: [etfin] # ꝫ
    substitutions:
      - pattern: b[:*:]us
        result: "b#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  christ-xp:
    description: Christ- expressed as "chi-rho".
    remarks: >
    examples: []
    class: mixed # abbreviation? contraction?
    entities: [chi, rho] # χ, ρ
    substitutions:
      - pattern: "chr[:*:]([:<:]ist.*[:>:])"
        result: "#1#2\\1"
    settings:
      always: ["#1-"]
      indicated: ["#1-*"]
      never: []

  christ-x:
    description: Christ- expressed as "chi" alone.
    remarks: >
    examples: []
    class: mixed # abbreviation? contraction?
    entities: [chi] # χ
    substitutions:
      - pattern: "ch[:*:]([:<:]rist.*[:>:])"
        result: "#1\\1"
    settings:
      always: ["#1-"]
      indicated: ["#1-*"]
      never: []

  con-initial:
    description: initial "con" or "com"
    remarks:  >
      There are a few ways initial "con" is abbreviated:
        - `ꝯ` – most typical.
        - `ↄ` – reversed "c" (with or without dot inside)
        - `ɔ` – open `o`. NOTE: MUFI allows it, but reccomends to use "reversed c" instead.
    examples: []
    class: abbreviation
    entities: [condes, conbase, condot] # [ꝯ, ↄ, ꜿ]
    substitutions:
      - pattern: c[:*:]o[mn]
        result: "#1"
    settings:
      always: ["#1-"]
      indicated: ["#1-*"]
      never: []

  et-final:
    description: Final "et"
    remarks: >
    examples: []
    class: abbreviation
    entities: [etfin] # ꝫ
    substitutions:
      - pattern: e[:*:]t
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  est-final:
    description: Final "est"
    remarks: >
    examples: []
    class: abbreviation
    entities: [etfin] # ꝫ
    substitutions:
      - pattern: e[:*:]st
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  # to do:
  # tittle:
  # - dot
  # - slash (ILVB 158 etc)
  # - absent
  i-dotless:
    description: A small 'i' without a dot (tittle).
    remarks: >
      Many scripts do not provide a dot (tittle) over i.
    examples: []
    class: allograph
    entities: [inodot] # ı
    substitutions:
    - pattern: "#1[:*:]"
      result: "#1"
    settings:
      always: ["#1"]
      indicated: ["#1*"]
      never: []

  # inodot:
  #   class: allograph
  #   pattern: i[:*:]
  #   unicode: ı
  #   mufi: inodot
  #   allographs: [i]

  i-initial-enlarged:
    description: Initial small "i" enlarges.
    remarks: >
      It is not yet clear wether this character should be represented
      by Unicode/MUFI "epigraphic I longa" `ꟾ`
      or MUFI's "enlarged small dotless i" ``.

      Wikipedia hints for Long_I, but only for late Roman and early medieval scripts: ttps://en.wikipedia.org/wiki/Long_I
      Examples contain an early XVI c. bastarda / fraktur (???) script from ILVB 158.

      As of MUFI 3.0, "enlarged small dotless i" is not a part of unicode, thus we recommend using the "epigraphic" i until it's included.
    examples:
    - source: ILVB 158
      link: ...
      img: ...
      script: ...
      paleo: >
        ---
        rules:
          i-initial-enlarged: indicated
        ---
        ...
    class: allograph
    entities: [Ilong, inodotenl] # [ꟾ, ]
    substitutions:
    - pattern: "#1[:*:]"
      result: "#1"
    settings:
      always: ["#1-"]
      indicated: ["#1-*"]

  m-final:
    description: Final "m".
    remarks: >
      Usually final "-am", "-em" or "-um".
    examples: []
    class: allograph
    entities: [etfin] # ꝫ
    substitutions:
      - pattern: "([:vowel:])#1[:*:]"
        result: "#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  nasal:
    description: Nasal stroke
    remarks: >
      This is one of the most common scriptural abbreviation.
    examples: []
    class: abbreviation
    entities: [bar] # vertical line
    substitutions:
      - pattern: ([:vowel:])[:*:][mn]
        result: \1#1
    settings:
      always: ["#1"]
      indicated: ["#1*"]
      never: []

  onem-final:
    description: Final "-onem"
    remarks: >
    examples: []
    class: abbreviation
    entities: [etfin] # ꝫ
    substitutions:
      - pattern: on[:*:]em
        result: "on#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  que-final:
    description: Final "que"
    remarks: >
      TO DO: verify whether it is only in final position.
    examples: []
    class: abbreviation
    entities: [etfin] # ꝫ
    substitutions:
      - pattern: q[:*:]ue
        result: "q#1"
    settings:
      always: ["-#1"]
      indicated: ["-#1*"]
      never: []

  r-rotunda:
    description: Variant of 'r' before "round" letters.
    remarks: >
      Different types have different definitions of what a "round" letter is.
      For gothic scripts its "o", "b", "p", "h", "w".
      Fraktur also has round "d"
    examples: []
    class: allograph
    entities: [rrot] # ꝛ
    substitutions:
      - pattern: ([[:roundletter:]])#1
        result: \1#1
      - pattern: "#1"
        result: "#1"
    settings:
      always: ["#2"]
      auto: ["#1"]
      indicated: ["#1*"]
      never: []

  s-long:
    description: Long s
    remarks: >
      This is the prevailing variant of small s in old scripts.
    examples: []
    class: allograph
    entities: [slong] # ſ
    substitutions:
      - pattern: "#1[:*:]"
        result: "#1"
    settings:
      always: ["#1"]
      auto: ["#1-", "-#1-", "-#1*"]
      indicated: ["#1*"]
      never: []

  us-final:
    description: Final -us or -er (ending of nominative 2nd declention)
    remarks: >
    examples: []
    class: abbreviation
    entities: [usmod] # ꝰ
    substitutions:
      - pattern: u[:*:]s
        result: "#1"
      - pattern: e[:*:]r
        result: "#1"
    settings:
      always: ["-#1", "-#2"]
      indicated: ["-#1*", "-#2*"]

  v-round:
    description: Round variant of "v".
    remarks: >
      Most old scripts do not distinguish between "v" and "u"
      (in a similar way that some modern Latin conventions do not distinguish between "i" and "j").
    examples: []
    class: allograph
    entities: []
    substitutions:
      - pattern: "v[:*:]"
        result: "u"
    settings:
      always: ["#1"]
      indicated: ["#1*"]
      never: []

  y-dotted:
    description: Dots over "y".
    remarks: >
    examples: []
    class: allograph
    entities: [ydot, yuml] # compound ẏ, ÿ (or single ẏ, ÿ)
    substitutions:
      - pattern: y[:*:]
        result: "#1"
      - pattern: y[:*:]
        result: "#2"
    settings:
      always-single: ["#1"]
      indicated-single: ["#1*"]
      always-double: ["#2"]
      indicated-double: ["#2"]
      auto: ["#2**", "#1*"]
      never: []

  # DEPRECATED

  christ:
    deprecated: true
    remarks: >
      For "x" use "christ-x" and mark abbreviation "ch*<rist..>..".
      For "xp", use "christ-xp" and mark special abbreviation ("chr*<ist..>..").
    version: 0.4.0
    target: null

  i-initial-capitalized:
    deprecated: true
    remarks: use `i-initial-enlarged`
    version: 0.4.0
    target: i-initial-enlarged

  v-as-u:
    deprecated: true
    remarks: use `v-round`
    version: 0.4.0
    target: v-round


presets: # TO DO: metaschema, update.

  medieval:
  - i-dotless: always
  - s-long: auto
  - et-final: indicated
  - m-final: indicated
  - nasal: indicated
  - v-round: always
  - r-rotunda: auto
  - y-dotted: always
  - christ: indicated

  renaissance:
  - s-long: auto
  - m-final: indicated
  - nasal: indicated
  - v-round: always
  - r-rotunda: auto

fonts:

  ...

  # insular

# fonts:
  # ...
